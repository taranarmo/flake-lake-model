name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake make

      - name: Build with CMake
        run: |
          cmake -B build
          cmake --build build

      - name: Run verification suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Test GNU Make workflow
        run: |
          make clean
          make
          make test
