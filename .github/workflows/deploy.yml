name: Build FLake WASM & Deploy to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba with LFortran & LLVM tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lfortran-env
          create-args: >-
            -c conda-forge
            lfortran=0.65.0
            llvm-tools
            lld

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Compile Fortran to WebAssembly & Build Website
        shell: bash -l {0}
        run: |
          echo "Verifying tool versions..."
          lfortran --version
          llc --version
          wasm-ld --version
          uv --version
          ./build.sh
          uv run build_site.py

      - name: Verify build artifacts
        run: |
          test -s _site/index.html
          test -s _site/model/index.html
          test -s _site/model/flake.wasm
          test -s _site/model/wasm-base64.js
          echo "WebAssembly binary size: $(wc -c < _site/model/flake.wasm) bytes"
          echo "Artifact verification passed!"

      - name: Setup GitHub Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
