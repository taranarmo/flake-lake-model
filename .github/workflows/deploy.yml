name: Build FLake WASM & Deploy to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build WebAssembly & Website via Nix
        run: nix build

      - name: Verify build artifacts
        run: |
          test -s result/index.html
          test -s result/model/index.html
          test -s result/model/flake.wasm
          test -s result/model/wasm-base64.js
          echo "WebAssembly binary size: $(wc -c < result/model/flake.wasm) bytes"
          echo "Artifact verification passed!"

      - name: Prepare Pages directory
        run: |
          rm -rf _site
          cp -RL result _site

      - name: Setup GitHub Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
